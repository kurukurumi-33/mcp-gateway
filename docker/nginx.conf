worker_processes 1;

events {
    worker_connections 256;
}

http {
    # No sticky sessions: the point of a stateless protocol is that either node can
    # serve any request, including the second round of a multi-round call.
    upstream mcp_backends {
        server gateway-a:8931 max_fails=1 fail_timeout=10s;
        server gateway-b:8931 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8931;

        location / {
            proxy_pass http://mcp_backends;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";

            # A connection-level failure means the request never produced an observable
            # effect, so replaying it on the other node is safe. This is only sound
            # because the gateway's mutating tools are confirm-gated and idempotent;
            # a backend with non-idempotent writes would need request de-duplication
            # before enabling non_idempotent here.
            proxy_next_upstream error timeout http_502 http_503 http_504 non_idempotent;
            proxy_next_upstream_tries 2;

            # SSE has to reach the client as it is produced.
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }
}