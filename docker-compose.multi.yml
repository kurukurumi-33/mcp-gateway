name: mcp-gateway-multi

# Two identical gateway instances behind nginx, for the experiment in
# docker/multi-instance-demo.sh: a multi-round call starts on one node and is resumed on
# the other. Both share MCP_REQUEST_STATE_SECRET — with a per-process key, the second
# node could not verify the token the first node signed.

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - seaweed-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  createbucket:
    image: curlimages/curl:latest
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      MCP_S3_BUCKET: ${MCP_S3_BUCKET:-mcp-demo}
    volumes:
      - ./docker/create-bucket.sh:/bootstrap/create-bucket.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap/create-bucket.sh"]
    restart: "no"

  gateway-a:
    build: .
    image: mcp-gateway:0.1.0
    depends_on:
      createbucket:
        condition: service_completed_successfully
    environment: &gateway-env
      MCP_S3_ENDPOINT: http://seaweedfs:8333
      MCP_S3_REGION: us-east-1
      MCP_S3_ACCESS_KEY: ${MCP_S3_ACCESS_KEY:-mcpaccess}
      MCP_S3_SECRET_KEY: ${MCP_S3_SECRET_KEY:-mcpsecretmcpsecret}
      MCP_S3_BUCKET: ${MCP_S3_BUCKET:-mcp-demo}
      MCP_REQUEST_STATE_SECRET: ${MCP_REQUEST_STATE_SECRET:-docker-compose-demo-signing-key-0123456789}
    ports:
      - "8932:8931"
    restart: unless-stopped

  gateway-b:
    build: .
    image: mcp-gateway:0.1.0
    depends_on:
      createbucket:
        condition: service_completed_successfully
    environment: *gateway-env
    ports:
      - "8933:8931"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    depends_on:
      - gateway-a
      - gateway-b
    ports:
      - "8931:8931"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped

volumes:
  seaweed-data: