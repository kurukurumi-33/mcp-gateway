name: CI

# The suite is the contract: every push runs the protocol, transport and backend tests.
# Integration tests that need an external service (S3, Redis) skip themselves when the endpoint is
# absent, so this workflow stays green on a machine with neither.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # The S3 integration tests skip themselves unless MCP_S3_ENDPOINT is set. This container
    # supplies it so the suite runs the adapter against a real S3 implementation rather than
    # leaving the storage paths unexecuted. MinIO was the obvious image here until it pulled its
    # Docker Hub images in 2025; SeaweedFS speaks the same API on the same port style.
    #
    # Redis does the same for the rate limiter: the Lua script and the refill behaviour can only be
    # checked against a real server.
    services:
      seaweedfs:
        image: chrislusf/seaweedfs:latest
        ports:
          - 8333:8333
        options: >-
          --health-cmd "wget -q -O /dev/null http://127.0.0.1:8333/ || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v7

      # 21 is the release target in the pom, not the local JDK. Building with it keeps
      # "works on my machine" from hiding a use of a newer API.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The adapter's health() is a HeadBucket and the tests assume the bucket exists.
      - name: Create the test bucket
        run: |
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8333/ && break
            sleep 1
          done
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT http://127.0.0.1:8333/mcp-demo)
          test "$code" = 200 -o "$code" = 409

      - name: Verify
        env:
          MCP_S3_ENDPOINT: http://127.0.0.1:8333
          MCP_S3_ACCESS_KEY: mcpaccess
          MCP_S3_SECRET_KEY: mcpsecretmcpsecret
          MCP_TEST_REDIS_HOST: 127.0.0.1
          MCP_TEST_REDIS_PORT: 6379
          MCP_TEST_REDIS_DB: 15
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*'
          if-no-files-found: ignore

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore