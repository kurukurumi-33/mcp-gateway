server:
  port: 8931

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:10}
      # Without these, actuator's Redis health check waits on an unreachable host for over a minute,
      # which is long enough for a load balancer to take the instance out of rotation.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

mcp:
  gateway:
    # Must stay the same across restarts, or in-flight multi-round calls become unresumable.
    # With no value a random key is generated and a warning is logged.
    request-state-secret: ${MCP_REQUEST_STATE_SECRET:}
    server-name: mcp-gateway-app
    server-version: 0.1.0
    cache-ttl-ms: 60000
    streaming-enabled: true

    # Refuse oversized bodies before parsing. Chunked requests have no Content-Length, so they are
    # counted as they are read instead.
    max-request-bytes: ${MCP_MAX_REQUEST_BYTES:1048576}
    # A requestState older than this is rejected; duration bounds how long a captured token replays.
    request-state-ttl-seconds: ${MCP_REQUEST_STATE_TTL_SECONDS:900}

    # Each backend namespace gets its own slot pool, so one slow backend cannot starve the others.
    # 0 for max-concurrent disables the bulkhead; 0 for the queue wait sheds callers immediately.
    max-concurrent-calls-per-backend: 16
    max-queued-calls-per-backend: 32
    admission-queue-wait-ms: 0
    # One adapter call may not exceed this. 0 disables the deadline.
    call-timeout-ms: 30000

    # Shared token bucket, one per backend namespace. Requires a Redis client on the classpath
    # (spring-boot-starter-data-redis). capacity is the burst, refill-per-second the sustained rate.
    rate-limit:
      enabled: ${MCP_RATE_LIMIT_ENABLED:false}
      capacity: ${MCP_RATE_LIMIT_CAPACITY:100}
      refill-per-second: ${MCP_RATE_LIMIT_REFILL:50}
      key-prefix: "mcp:gateway:rate:"
      # When Redis is down: true lets calls through, false rejects them with a 1s retry hint.
      fail-open: true
      # Upper bound for one limiter check, so an outage cannot stall every call on the client's
      # own (usually 60 s) Redis command timeout.
      timeout-ms: 100

    # Leave endpoint empty to run with the in-memory demo adapter instead.
    # Works with any S3 implementation: SeaweedFS, MinIO, Ceph, OSS, AWS.
    s3:
      endpoint: ${MCP_S3_ENDPOINT:}
      region: ${MCP_S3_REGION:us-east-1}
      access-key: ${MCP_S3_ACCESS_KEY:}
      secret-key: ${MCP_S3_SECRET_KEY:}
      bucket: ${MCP_S3_BUCKET:mcp-demo}

    # Read-only SQL backend. jdbc:duckdb: is in-memory and is seeded with sample tables at startup.
    # Point at jdbc:duckdb:D:/data/analytics.duckdb to persist; the seed is then skipped.
    duckdb:
      url: ${MCP_DUCKDB_URL:jdbc:duckdb:}
      max-rows: 200
      timeout-seconds: 5

    # Spark runs as a subprocess, never inside the gateway JVM. Off by default because it needs a
    # local Spark installation, and every call pays a JVM start.
    spark:
      enabled: ${MCP_SPARK_ENABLED:false}
      submit: ${MCP_SPARK_SUBMIT:}
      master: ${MCP_SPARK_MASTER:local[2]}
      python: ${MCP_SPARK_PYTHON:}
      spark-home: ${MCP_SPARK_HOME:}
      # Windows only: Spark refuses to start without HADOOP_HOME and its bin on PATH.
      hadoop-home: ${MCP_SPARK_HADOOP_HOME:}
      max-rows: 50
      # The driver's own limit. The gateway's call-timeout-ms still applies on top.
      timeout-seconds: 60
      # One driver at a time by default; the gateway bulkhead limits callers, this protects the host.
      max-parallel-jobs: 1

management:
  health:
    redis:
      # With fail-open, a DOWN Redis would mark the whole instance DOWN and a load balancer would
      # drain it — the opposite of the failure policy. Alert on mcp.gateway.rate_limit.errors.
      enabled: ${MCP_REDIS_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.github.kurukurumi33.mcp: INFO